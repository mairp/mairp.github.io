<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      .name  { font-family:'Bricolage Grotesque','DejaVu Sans',sans-serif; font-weight:700; }
      .mono  { font-family:'JetBrains Mono','DejaVu Sans Mono',monospace; }
      .body  { font-family:'Manrope','DejaVu Sans',sans-serif; }
    </style>
  </defs>

  <!-- ground -->
  <rect width="1200" height="630" fill="#000000"/>

  <!-- faint node mesh, top-right -->
  <g stroke="#76B900" stroke-width="1.2" opacity="0.22" fill="none">
    <path d="M760 70 L900 130 L1040 90 L1130 180 L980 230 L900 130 M760 70 L820 200 L980 230"/>
  </g>
  <g fill="#76B900" opacity="0.7">
    <circle cx="760" cy="70" r="5"/><circle cx="900" cy="130" r="5"/>
    <circle cx="1040" cy="90" r="5"/><circle cx="1130" cy="180" r="5"/>
    <circle cx="980" cy="230" r="5"/><circle cx="820" cy="200" r="4"/>
  </g>

  <!-- accent rule -->
  <rect x="80" y="150" width="64" height="6" fill="#76B900"/>

  <!-- status line -->
  <text x="80" y="130" class="mono" font-size="24" letter-spacing="6" fill="#8f8f8f">// NETWORK ARCHITECT · DCI/OSS · CLOUD NETWORKING</text>

  <!-- name -->
  <text x="76" y="290" class="name" font-size="128" letter-spacing="-3" fill="#ffffff">Marlon <tspan fill="#76B900">Paz</tspan></text>

  <!-- role -->
  <text x="80" y="360" class="mono" font-size="34" fill="#ffffff">Agentic AI · Autonomous Networks · Internet of Agents</text>

  <!-- one-liner -->
  <text x="80" y="430" class="body" font-size="27" fill="#8f8f8f">Production multi-agent systems — AGNTCY · A2A · LangGraph · Agentic RAG,</text>
  <text x="80" y="468" class="body" font-size="27" fill="#8f8f8f">full OpenTelemetry observability — on 15+ years of expert networking.</text>

  <!-- credential chips -->
  <g class="mono" font-size="24" fill="#76B900">
    <rect x="80"  y="520" width="118" height="52" fill="none" stroke="#5f9400" stroke-width="1.5"/>
    <text x="139" y="553" text-anchor="middle">CCIE</text>
    <rect x="214" y="520" width="108" height="52" fill="none" stroke="#5f9400" stroke-width="1.5"/>
    <text x="268" y="553" text-anchor="middle">CKA</text>
    <rect x="338" y="520" width="230" height="52" fill="none" stroke="#5f9400" stroke-width="1.5"/>
    <text x="453" y="553" text-anchor="middle">NVIDIA AIOps</text>
    <rect x="584" y="520" width="250" height="52" fill="none" stroke="#5f9400" stroke-width="1.5"/>
    <text x="709" y="553" text-anchor="middle">IEEE Author</text>
  </g>

  <!-- domain -->
  <text x="1120" y="560" class="mono" font-size="26" text-anchor="end" fill="#ffffff">mairp.ai</text>
</svg>
