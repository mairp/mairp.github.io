<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Marlon Paz">
  <rect width="64" height="64" fill="#000000"/>
  <!-- node-mesh monogram: three linked nodes forming an 'M'-ish agent graph -->
  <g stroke="#76B900" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M14 46 L14 20 L32 38 L50 20 L50 46"/>
  </g>
  <g fill="#76B900">
    <circle cx="14" cy="20" r="5"/>
    <circle cx="32" cy="38" r="5"/>
    <circle cx="50" cy="20" r="5"/>
    <circle cx="14" cy="46" r="4"/>
    <circle cx="50" cy="46" r="4"/>
  </g>
</svg>
